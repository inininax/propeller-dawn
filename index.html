<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Propeller Dawn — Outfly the Last Dawn</title>
    <meta
      name="description"
      content="An original browser-based vertical shoot 'em up featuring piston-powered fighters, intense aerial combat, and epic boss battles."
    />
    <meta name="theme-color" content="#0b1026" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Propeller Dawn" />
    <meta property="og:title" content="Propeller Dawn — Outfly the Last Dawn" />
    <meta
      property="og:description"
      content="Pilot original piston-powered fighters through dawn skies in this free browser shoot 'em up. Two stages, epic bosses, three difficulty levels."
    />
    <meta name="robots" content="index,follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #05070f;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #game-root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game-root canvas {
        display: block;
        outline: none;
      }
      #boot-error {
        position: fixed;
        inset: 0;
        display: none;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #e8e3d5;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Apple SD Gothic Neo',
          'Noto Sans KR',
          sans-serif;
        padding: 24px;
      }
      #boot-error h1 {
        font-size: 20px;
        margin: 0;
      }
      #boot-error pre {
        font-size: 12px;
        max-width: 90vw;
        white-space: pre-wrap;
        color: #f2a35c;
      }
      #boot-error button {
        font-size: 16px;
        padding: 10px 28px;
        border-radius: 8px;
        border: 1px solid #f2a35c;
        background: transparent;
        color: #f2a35c;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="boot-error" role="alertdialog" aria-live="assertive">
      <h1>Propeller Dawn failed to start</h1>
      <pre id="boot-error-detail"></pre>
      <button onclick="window.location.reload()">Retry</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
